<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{config['TITLE']}}{% block title %}{% endblock %}</title>
        <!-- Bootstrap core CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!-- CSS files -->
         <link rel="stylesheet" href="{{url_for('static', filename='css/layout.css')}}">
        {% block link_css %}{% endblock %}
    </head>
    <body>
        <header class="sticky-sm-top">
            <nav class="p-3 d-flex align-items-center">
                <div class="container-fluid">
                    <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                        <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                            <img class="me-3" src="{{url_for('static', filename='image/money.png')}}" alt="Metro Logo" width="40px", height="40px", style="border-radius: 5px;">
                            <span class="ms-2 titulo"><strong>{{config['TITLE']}}</strong></span>
                        </a>
            
                        <ul class="nav col-12 col-sm-auto me-lg-auto mb-2 justify-content-center mb-md-0 ms-2" style="padding-left: 40px;">
                            <li><a href="{{url_for('webui.index')}}" class="nav-link px-2 {% block nav_bh %}{% endblock %}">Controles</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        {% block main %}
        {% endblock %}

        {% block js %}
        {% endblock %}

        <footer class="container-fluid text-center">
          <div class="align-items-center w-100 ps-5 ms-5">
            <a href="/" class="text-decoration-none lh-1">
                <img class="me-2" src="{{url_for('static', filename='image/money.png')}}" alt="Metro Logo" width="25px", height="25px", style="border-radius: 25px;">
            </a>
            <span class=""><strong>{{config['TITLE']}}</strong> - Lucas Ribeiro - {{ datetime.now().strftime('%d/%m/%Y') }}</span>
          </div>
        </footer>

        <!-- JS Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
