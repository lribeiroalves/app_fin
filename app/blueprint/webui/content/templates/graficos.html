{%  extends "layout.html" %}

{% block title %}
 - Gráficos
{% endblock %}

{% block link_css %}
<link rel="stylesheet" href="{{url_for('webui.static', filename='css/graficos.css')}}">
{% endblock %}

{% block main %}
<div class="d-flex flex-row flex-grow-1">
    <div class="d-flex flex-column px-3 aba-lateral">
        <div class="card w-100 flex-grow-1 shadow-sm border-0">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title fw-bold mb-4 text-secondary">
                    <i class="bi bi-funnel"></i> Filtros
                </h5>

                <!-- Filtro de Ano -->
                <div class="mb-4">
                    <label for="selectAno" class="form-label fw-semibold text-muted small text-uppercase">Ano Referência</label>
                    <select class="form-select border-secondary-subtle focus-ring" id="selectAno">
                        <!-- Usar loop do Jinja aqui no futuro -->
                        <option value="2026" selected>2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                    </select>
                </div>

                <!-- Filtro de Meses -->
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small text-uppercase mb-3">Meses</label>
                    
                    <!-- Grid para os botões de meses -->
                    <div class="row g-2">
                        <!-- Janeiro -->
                        <div class="col-4">
                            <input type="checkbox" class="btn-check" id="mes-01" autocomplete="off" checked>
                            <label class="btn btn-mes w-100 btn-sm" for="mes-01">Jan</label>
                        </div>
                        <!-- Fevereiro -->
                        <div class="col-4">
                            <input type="checkbox" class="btn-check" id="mes-02" autocomplete="off" checked>
                            <label class="btn btn-mes w-100 btn-sm" for="mes-02">Fev</label>
                        </div>
                        <!-- Março -->
                        <div class="col-4">
                            <input type="checkbox" class="btn-check" id="mes-03" autocomplete="off" checked>
                            <label class="btn btn-mes w-100 btn-sm" for="mes-03">Mar</label>
                        </div>
                        <!-- Abril -->
                        <div class="col-4">
                            <input type="checkbox" class="btn-check" id="mes-04" autocomplete="off" checked>
                            <label class="btn btn-mes w-100 btn-sm" for="mes-04">Abr</label>
                        </div>
                        <!-- Maio -->
                        <div class="col-4">
                            <input type="checkbox" class="btn-check" id="mes-05" autocomplete="off" checked>
                            <label class="btn btn-mes w-100 btn-sm" for="mes-05">Mai</label>
                        </div>
                        <!-- Junho -->
                        <div class="col-4">
                            <input type="checkbox" class="btn-check" id="mes-06" autocomplete="off" checked>
                            <label class="btn btn-mes w-100 btn-sm" for="mes-06">Jun</label>
                        </div>
                        <!-- Julho -->
                        <div class="col-4">
                            <input type="checkbox" class="btn-check" id="mes-07" autocomplete="off" checked>
                            <label class="btn btn-mes w-100 btn-sm" for="mes-07">Jul</label>
                        </div>
                        <!-- Agosto -->
                        <div class="col-4">
                            <input type="checkbox" class="btn-check" id="mes-08" autocomplete="off" checked>
                            <label class="btn btn-mes w-100 btn-sm" for="mes-08">Ago</label>
                        </div>
                        <!-- Setembro -->
                        <div class="col-4">
                            <input type="checkbox" class="btn-check" id="mes-09" autocomplete="off" checked>
                            <label class="btn btn-mes w-100 btn-sm" for="mes-09">Set</label>
                        </div>
                        <!-- Outubro -->
                        <div class="col-4">
                            <input type="checkbox" class="btn-check" id="mes-10" autocomplete="off" checked>
                            <label class="btn btn-mes w-100 btn-sm" for="mes-10">Out</label>
                        </div>
                        <!-- Novembro -->
                        <div class="col-4">
                            <input type="checkbox" class="btn-check" id="mes-11" autocomplete="off" checked>
                            <label class="btn btn-mes w-100 btn-sm" for="mes-11">Nov</label>
                        </div>
                        <!-- Dezembro -->
                        <div class="col-4">
                            <input type="checkbox" class="btn-check" id="mes-12" autocomplete="off" checked>
                            <label class="btn btn-mes w-100 btn-sm" for="mes-12">Dez</label>
                        </div>
                    </div>
                </div>

                <!-- Botão de Ação -->
                <!-- A classe mt-auto empurra este bloco para o final do card -->
                <div class="mt-auto">
                    <button class="btn btn-update w-100 shadow-sm" type="button" id="atualiza-grafico">
                        <i class="bi bi-search me-2"></i> Atualizar Gráficos
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="d-flex flex-column w-75 px-3">
        <ul class="nav nav-tabs nav-fill" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab1" data-bs-toggle="tab" data-bs-target="#graf1" type="button" role="tab" aria-controls="tab1" aria-selected="true">Entradas/Saidas</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab2" data-bs-toggle="tab" data-bs-target="#graf2" type="button" role="tab" aria-controls="tab2" aria-selected="false">Saldos</button>
            </li>
        </ul>

        <div class="tab-content flex-grow-1">
            <div class="tab-pane fade p-4 show active h-100" id="graf1" role="tabpanel" aria-labelledby="tab1">
                <div class="card w-100 flex-grow-1 shadow-sm border-0 h-100">
                    <div class="card-body d-flex flex-column">
                        <canvas id="grafico1"></canvas>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade p-4 h-100" id="graf2" role="tabpanel" aria-labelledby="tab2">
                <div class="card w-100 flex-grow-1 shadow-sm border-0 h-100">
                    <div class="card-body d-flex flex-column">
                        <canvas id="grafico2"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{{url_for('webui.static', filename='js/graficos_completos.js')}}"></script>
{% endblock %}
